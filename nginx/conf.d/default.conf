# Default nginx config for frontend
# This file is mounted into the nginx container for the frontend service

server {
    listen 80;
    server_name _;
    root /app/out;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml image/svg+xml font/woff font/woff2;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /_next/static/ {
        alias /app/out/_next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /app/out/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}